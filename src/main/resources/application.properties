spring.application.name=connectbeleza
# spring.profiles.active=test

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/healthmind
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# ===============================
# SERVER
# ===============================
server.port=8080
server.servlet.context-path=/api/v1

# ===============================
# SPRINGDOC / SWAGGER
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===============================
# APP CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:healthmind-secret-key-must-be-at-least-256-bits-long}
app.jwt.expiration-ms=86400000

app.pagination.default-page-size=20
app.pagination.max-page-size=100